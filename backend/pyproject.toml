[project]
name = "ai-recruitment-platform-backend"
version = "0.1.0"
description = "AI Recruitment Platform - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pymongo>=4.9",
    # SQLAlchemy column type + query operators for Postgres's pgvector
    # extension (docs/architecture.md § 1 / § 7: pgvector-backed resume
    # chunk retrieval for the internal AI matching engine).
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
